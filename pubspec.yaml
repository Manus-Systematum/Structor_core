name: wh40k_core
description: >-
  Pure-Dart domain core for the Warhammer 40,000 11th edition companion app:
  source ingest, normalised model, validation and rules rendering. No Flutter
  dependency, so the same code runs in the ETL, the app and (later) the server.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.4.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
dependencies:
  crypto: ^3.0.7
  yaml: ^3.1.3
